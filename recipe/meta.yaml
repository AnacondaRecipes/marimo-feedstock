{% set name = "marimo" %}
{% set version = "0.23.15" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3c672256b420abc2b0509f2bfaedd2ee20af5902306c943cb6632e4d33b82c88

build:
  number: 0
  entry_points:
    - marimo = marimo._cli.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  binary_relocation: false
  missing_dso_whitelist:
    # marimo vendors prebuilt Node native addons (Copilot LSP feature)
    # for linux/arm64 and linux/x64 targets unrelated to this build's
    # sysroot. These are optional runtime-loaded binaries, not linked
    # against our host env, so we whitelist rather than patch every libc symbol.
    - /lib64/libdl.so.2  # [linux]
    - /lib64/libstdc++.so.6  # [linux]
    - /lib64/libgcc_s.so.1  # [linux]
    - /lib64/libpthread.so.0  # [linux]
    - /lib64/libc.so.6  # [linux]
    - /lib64/libm.so.6  # [linux]
    - $RPATH/ld-linux-aarch64.so.1  # [linux]
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - uv-build >=0.8.3,<0.12.0
  run:
    - python
    - click >=8.0,<9
    - jedi >=0.18.0,<0.20.0
    - markdown >=3.6,<4
    - pymdown-extensions >=10.21.2,<11
    - pygments >=2.19,<3
    - tomlkit >=0.12.0
    - pyyaml >=6.0.1
    - uvicorn >=0.22.0
    - starlette >=0.37.2
    - python-multipart >=0.0.18
    - websockets >=14.2.0
    - loro >=1.10.0
    - typing-extensions >=4.4.0  # [py<311]
    - docutils >=0.16.0
    - psutil >=5.0
    - itsdangerous >=2.0.0
    - narwhals >=2.0.0
    - packaging
    - msgspec >=0.20.0
    - pyzmq >=27.1.0  # [py<315]
  run_constrained:
    - duckdb >=1.0.0
    - polars >=1.9.0
    - sqlglot >=26.8.0
    - pyzmq >=27.1.0
    - uv >=0.9.21
    - cryptography >=42.0.0
    - altair >=5.4.0
    - pydantic-ai-slim >=1.107.0,<3.0.0
    - nbformat >=5.7.0
    - python-lsp-server >=1.13.0
    - python-lsp-ruff >=2.0.0
    - mcp >=1.0.0
    - pydantic >2
    - opentelemetry-api >=1.28.0,<1.29.0
    - opentelemetry-sdk >=1.28.0,<1.29.0
    - opentelemetry-exporter-otlp-proto-http >=1.28.0,<1.29.0
    - opentelemetry-exporter-otlp-proto-grpc >=1.28.0,<1.29.0

test:
  imports:
    - marimo
    - marimo._ai
    - marimo._ast
    - marimo._cli
    - marimo._config
    - marimo._convert
    - marimo._data
    - marimo._dependencies
    - marimo._entrypoints
    - marimo._islands
    - marimo._lint
    - marimo._loggers
    - marimo._mcp
    - marimo._messaging
    - marimo._output
    - marimo._plugins
    - marimo._pyodide
    - marimo._runtime
    - marimo._save
    - marimo._schemas
    - marimo._secrets
    - marimo._server
    - marimo._snippets
    - marimo._sql
    - marimo._tracer
    - marimo._tutorials
    - marimo._types
    - marimo._utils
    - marimo._version
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - marimo --help
    - marimo --version

about:
    home: https://marimo.io
    license: Apache-2.0
    license_family: Apache
    license_file:
      - LICENSE
      - marimo/third_party.txt
      - marimo/third_party_licenses.txt
    summary: A library for making reactive notebooks and apps
    description: |
        A reactive Python notebook that's reproducible, git-friendly,
        and deployable as scripts or apps
    doc_url: https://docs.marimo.io
    dev_url: https://github.com/marimo-team/marimo

extra:
  recipe-maintainers:
    - mscolnick
    - akshayka
    - mfansler
