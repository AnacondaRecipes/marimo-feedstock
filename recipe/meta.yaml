{% set name = "marimo" %}
{% set version = "0.23.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f33f17abb5106edabf6921d016d91a6d8f02b4d1b0ed599039957b8f7f5b9489

build:
  number: 0
  skip: true  # [py<310]
  entry_points:
    - marimo = marimo._cli.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  binary_relocation: false
  missing_dso_whitelist:  # [linux]
    - "*"  # [linux]

requirements:
  host:
    - python
    - pip
    - uv-build >=0.8.3,<0.12.0
    - uv_build >=0.8.3,<0.12.0
    - starlette
  run:
    - python
    - click >=8.0,<9  # [not emscripten]
    - jedi >=0.18.0,<0.20.0
    - markdown >=3.6,<4
    - pymdown-extensions >=10.21.2,<11
    - pygments >=2.19,<3
    - tomlkit >=0.12.0
    - pyyaml >=6.0.1
    - uvicorn >=0.22.0  # [not emscripten]
    - starlette >=0.37.2  # [not emscripten]
    - python-multipart >=0.0.18
    - websockets >=14.2.0  # [not emscripten]
    - loro >=1.10.0  # [not emscripten and not android]
    - typing-extensions >=4.4.0  # [py<311]
    - docutils >=0.16.0
    - psutil >=5.0  # [not emscripten and not android]
    - itsdangerous >=2.0.0
    - narwhals >=2.0.0
    - packaging
    - msgspec >=0.20.0
    - pyzmq >=27.1.0  # [py<315]
    - typing_extensions >=4.4.0  # [py<311]
  run_constrained:
    - duckdb >=1.0.0
    - polars >=1.9.0
    - sqlglot >=26.8.0
    - pyzmq >=27.1.0
    - altair >=5.4.0
    - pydantic-ai-slim >=1.107.0,<3.0.0
    - ruff
    - nbformat >=5.7.0
    - python-lsp-server >=1.13.0
    - python-lsp-ruff >=2.0.0
    - mcp >=1.0.0
    - pydantic >2
    - opentelemetry-api >=1.28.0,<1.29.dev0
    - opentelemetry-sdk >=1.28.0,<1.29.dev0
    - opentelemetry-exporter-otlp-proto-http >=1.28.0,<1.29.dev0
    - opentelemetry-exporter-otlp-proto-grpc >=1.28.0,<1.29.dev0
    - cryptography >=42.0.0
    - uv >=0.9.21
    - python-duckdb >=1.0.0

test:
  imports:
    - marimo
    - marimo._ai
    - marimo._ast
    - marimo._cli
    - marimo._config
    - marimo._convert
    - marimo._data
    - marimo._dependencies
    - marimo._entrypoints
    - marimo._islands
    - marimo._lint
    - marimo._loggers
    - marimo._mcp
    - marimo._messaging
    - marimo._output
    - marimo._plugins
    - marimo._pyodide
    - marimo._runtime
    - marimo._save
    - marimo._schemas
    - marimo._secrets
    - marimo._server
    - marimo._snippets
    - marimo._sql
    - marimo._tracer
    - marimo._tutorials
    - marimo._types
    - marimo._utils
    - marimo._version
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - marimo --help
    - marimo --version

about:
  home: https://marimo.io
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - marimo/third_party.txt
    - marimo/third_party_licenses.txt
  summary: A library for making reactive notebooks and apps
  description: |
    A reactive Python notebook that's reproducible, git-friendly,
    and deployable as scripts or apps
  doc_url: https://docs.marimo.io
  dev_url: https://github.com/marimo-team/marimo

extra:
  recipe-maintainers:
    - mscolnick
    - akshayka
    - mfansler
